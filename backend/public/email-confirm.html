<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <title>Имейл потвърден</title>
    <link rel="stylesheet" href="/confirm.css" />
  </head>
  <body>
    <div class="box fade-in">
      <h2>Имейлът е потвърден успешно ✅</h2>
      <p>Можете да продължите към вход.</p>

    <script>

      }, 5000);
    </script>
  </body>
